services:
  db:
    image: postgres:15-alpine
    container_name: firstwrite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - firstwrite-db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  api:
    container_name: firstwrite-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@firstwrite-db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.firstwrite-api.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is required}`) && PathPrefix(`/api`)
      - traefik.http.routers.firstwrite-api.entrypoints=websecure
      - traefik.http.routers.firstwrite-api.tls=true
      - traefik.http.routers.firstwrite-api.tls.certresolver=myresolver
      - traefik.http.routers.firstwrite-api.priority=100
      - traefik.http.routers.firstwrite-api.service=firstwrite-api
      - traefik.http.services.firstwrite-api.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  web:
    container_name: firstwrite-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:?VITE_VAPID_PUBLIC_KEY is required}
    restart: unless-stopped
    expose:
      - '8080'
    cap_drop:
      - ALL
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.firstwrite-web.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is required}`)
      - traefik.http.routers.firstwrite-web.entrypoints=websecure
      - traefik.http.routers.firstwrite-web.tls=true
      - traefik.http.routers.firstwrite-web.tls.certresolver=myresolver
      - traefik.http.routers.firstwrite-web.priority=1
      - traefik.http.routers.firstwrite-web.service=firstwrite-web
      - traefik.http.services.firstwrite-web.loadbalancer.server.port=8080
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

volumes:
  postgres_data:

networks:
  default:
    internal: true
  proxy:
    external: true
    name: proxy
